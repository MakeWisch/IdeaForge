[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API rewrites for production Netlify deployment
[[redirects]]
  from = "/api/ai/status"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

# Single Page App routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
